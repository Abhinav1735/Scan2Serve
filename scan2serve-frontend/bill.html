<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Scan2Serve - Bill</title>

    <link rel="stylesheet" href="css/bill.css" />
  </head>

  <body>
    <div class="bill-container">
      <!-- =========================================
           LOADING
      ========================================== -->

      <div id="loading" class="loading">Loading bill...</div>

      <!-- =========================================
           BILL
      ========================================== -->

      <div id="billContent" class="bill-content">
        <!-- =====================================
             HEADER
        ====================================== -->

        <div class="header">
          <h1>Scan2Serve</h1>

          <p>Restaurant Digital Bill</p>
        </div>

        <!-- =====================================
             ORDER INFORMATION
        ====================================== -->

        <div class="order-info">
          <div>
            <strong> Order ID: </strong>

            <span id="orderId"> - </span>
          </div>

          <div>
            <strong> Table: </strong>

            <span id="tableNumber"> - </span>
          </div>
        </div>

        <!-- =====================================
             ITEMS
        ====================================== -->

        <table>
          <thead>
            <tr>
              <th>Item</th>

              <th>Qty</th>

              <th>Unit Price</th>

              <th>Total</th>

              <th>Status</th>
            </tr>
          </thead>

          <tbody id="billItems"></tbody>
        </table>

        <!-- =====================================
             BILL CALCULATION NOTE
        ====================================== -->

        <p class="bill-note">
          Note: The bill amount is calculated only for items that are Ready or
          Served.
        </p>

        <!-- =====================================
             TOTALS
        ====================================== -->

        <div class="totals">
          <div class="total-row">
            <span> Subtotal </span>

            <span> ₹<span id="subtotal"> 0.00 </span> </span>
          </div>

          <div class="total-row">
            <span> GST (5%) </span>

            <span> ₹<span id="gst"> 0.00 </span> </span>
          </div>

          <div class="total-row grand-total">
            <span> Grand Total </span>

            <span> ₹<span id="grandTotal"> 0.00 </span> </span>
          </div>
        </div>

        <!-- =====================================
             CUSTOMER BUTTONS
        ====================================== -->

        <div class="buttons">
          <button class="menu-btn" onclick="goToMenu()">← Back to Menu</button>
        </div>
      </div>

      <!-- =========================================
           ERROR
      ========================================== -->

      <div id="error" class="error">Unable to load bill.</div>
    </div>

    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="js/bill.js"></script>
  </body>
</html>
