<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Scan2Serve - Bill</title>

    <link rel="stylesheet" href="css/bill.css" />
  </head>

  <body>
    <div class="bill-container">
      <!-- Loading -->
      <div id="loading" class="loading">Loading bill...</div>

      <!-- Bill -->
      <div id="billContent" class="bill-content">
        <div class="header">
          <h1>Scan2Serve</h1>

          <p>Restaurant Digital Bill</p>
        </div>

        <!-- Order Information -->
        <div class="order-info">
          <div>
            <strong>Order ID:</strong>
            <span id="orderId">-</span>
          </div>

          <div>
            <strong>Table:</strong>
            <span id="tableNumber">-</span>
          </div>
        </div>

        <!-- Items -->
        <table>
          <thead>
            <tr>
              <th>Item</th>

              <th>Qty</th>

              <th>Unit Price</th>

              <th>Total</th>
            </tr>
          </thead>

          <tbody id="billItems"></tbody>
        </table>

        <!-- Totals -->
        <div class="totals">
          <div class="total-row">
            <span>Subtotal</span>

            <span> ₹<span id="subtotal">0.00</span> </span>
          </div>

          <div class="total-row">
            <span>GST (5%)</span>

            <span> ₹<span id="gst">0.00</span> </span>
          </div>

          <div class="total-row grand-total">
            <span>Grand Total</span>

            <span> ₹<span id="grandTotal">0.00</span> </span>
          </div>
        </div>

        <!-- Buttons -->
        <div class="buttons">
          <button class="print-btn" onclick="printBill()">🖨️ Print Bill</button>

          <button class="menu-btn" onclick="goToMenu()">← Back to Menu</button>
        </div>
      </div>

      <!-- Error -->
      <div id="error" class="error">Unable to load bill.</div>
    </div>

    <script src="js/bill.js"></script>
  </body>
</html>
