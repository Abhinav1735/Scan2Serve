<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kitchen Dashboard - Scan2Serve</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header kitchen-header">
      <h1>👨‍🍳 Kitchen Dashboard</h1>

      <p id="kitchenStatus">Loading orders...</p>
    </header>

    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="kitchen-main">
      <!-- =================================================
             DASHBOARD HEADER
             ================================================= -->

      <div class="kitchen-top-bar">
        <div>
          <h2>Kitchen Orders</h2>

          <p id="lastUpdated">-</p>
        </div>

        <button class="kitchen-refresh-button" onclick="loadKitchenOrders()">
          Refresh
        </button>
      </div>

      <!-- =================================================
             ERROR
             ================================================= -->

      <p id="kitchenError" class="kitchen-error"></p>

      <!-- =================================================
             NEW ORDERS
             ================================================= -->

      <section class="kitchen-section">
        <div class="kitchen-section-header">
          <h2>New Orders</h2>

          <span id="pendingCount" class="kitchen-count"> 0 </span>
        </div>

        <div id="pendingOrders" class="kitchen-orders-grid">
          <p class="kitchen-empty">No new orders</p>
        </div>
      </section>

      <!-- =================================================
             PREPARING
             ================================================= -->

      <section class="kitchen-section">
        <div class="kitchen-section-header">
          <h2>Preparing</h2>

          <span id="preparingCount" class="kitchen-count"> 0 </span>
        </div>

        <div id="preparingOrders" class="kitchen-orders-grid">
          <p class="kitchen-empty">No orders being prepared</p>
        </div>
      </section>

      <!-- =================================================
             READY
             ================================================= -->

      <section class="kitchen-section">
        <div class="kitchen-section-header">
          <h2>Ready</h2>

          <span id="readyCount" class="kitchen-count"> 0 </span>
        </div>

        <div id="readyOrders" class="kitchen-orders-grid">
          <p class="kitchen-empty">No ready orders</p>
        </div>
      </section>
    </main>

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/kitchen.js"></script>
  </body>
</html>
