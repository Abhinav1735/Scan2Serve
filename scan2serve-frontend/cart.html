<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Scan2Serve Cart</title>

    <link rel="stylesheet" href="css/cart.css" />
  </head>

  <body>
    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">
      <!-- TABLE CARD -->

      <div class="table-card">
        <p id="tableInfo">Table</p>
      </div>

      <!-- RESTAURANT NAME -->

      <div class="header-center">
        <h1>Scan2Serve</h1>

        <p id="headerTableInfo">Table</p>
      </div>

      <!-- HEADER BUTTONS -->

      <div class="menu-header-buttons">
        <a id="menuButton" class="header-action-button menu-button" href="#">
          <span class="button-icon"> 🍽️ </span>

          <span class="button-text"> View Menu </span>
        </a>

        <a
          id="headerOrderButton"
          class="header-action-button order-button"
          href="#"
          style="display: none"
        >
          <span class="button-icon"> 📋 </span>

          <span class="button-text"> View Current Order </span>
        </a>
      </div>
    </header>

    <!-- =========================
         MAIN
    ========================== -->

    <main>
      <h2>Your Cart</h2>

      <div id="cartContainer">
        <p id="loading">Loading cart...</p>
      </div>
    </main>

    <script src="js/cart.js"></script>
  </body>
</html>
