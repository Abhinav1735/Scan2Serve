<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Scan2Serve Menu</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/menu.css" />
  </head>

  <body>
    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">
      <!-- TABLE CARD -->
      <div class="table-card">
        <span id="tableInfo">Table 1</span>
      </div>

      <!-- RESTAURANT NAME -->
      <div class="menu-title">
        <h1>Scan2Serve</h1>
      </div>

      <!-- HEADER ACTIONS -->
      <div class="menu-header-buttons">
        <!-- CART -->
        <a
          id="cartButton"
          href="#"
          class="header-action-button cart-action-button"
          aria-label="View Cart"
          title="View Cart"
        >
          <span class="button-icon">🛒</span>
          <span class="button-text">View Cart</span>
        </a>

        <!-- CURRENT ORDER -->
        <a
          id="viewOrderButton"
          href="#"
          class="header-action-button order-action-button"
          style="display: none"
          aria-label="View Current Order"
          title="View Current Order"
        >
          <span class="button-icon">📋</span>
          <span class="button-text">View Current Order</span>
        </a>
      </div>
    </header>

    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>
      <section id="menuContainer">
        <p id="loading">Loading menu...</p>
      </section>
    </main>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/menu.js"></script>
  </body>
</html>
